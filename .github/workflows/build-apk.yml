name: APK bauen

# Baut bei jedem Push nach "main" automatisch eine installierbare APK-Datei
# und stellt sie als Download bereit (Tab "Actions" -> jeweiliger Lauf ->
# Abschnitt "Artifacts" ganz unten). Kein Android Studio noetig.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Noetig, damit der Workflow die APK unter "Releases" als festen Download-Link ablegen darf.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Java (JDK 17) einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: gradlew ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: APK bauen (Debug)
        run: ./gradlew --no-daemon assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: BlutigeSeitenKiosk-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # Fester Download-Link ohne ZIP und ohne Anmeldung - direkt am Handy im Browser oeffnen:
      # https://github.com/paraloxreutlingen-stunden/blutige-seiten-kiosk/releases/download/apk-aktuell/BlutigeSeitenKiosk.apk
      # Bei jedem Build wird die Datei dort durch die neueste Version ersetzt.
      - name: APK unter festem Link veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BlutigeSeitenKiosk.apk
          gh release view apk-aktuell >/dev/null 2>&1 || \
            gh release create apk-aktuell --title "Aktuelle APK" \
              --notes "Immer die neueste Version. Direkt am Handy herunterladen und antippen zum Installieren."
          gh release upload apk-aktuell BlutigeSeitenKiosk.apk --clobber
